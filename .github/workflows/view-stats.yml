# Once a day, reads visitor totals from GoatCounter and publishes them as
# country-stats.json on the "stats" branch. The footer reads that file.
# Writing to a separate branch keeps main free of daily commits.
name: View stats

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency: view-stats

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read totals from GoatCounter
        env:
          GC_SITE: srahman7900
          GC_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: |
          mkdir -p out
          node .github/scripts/view-stats.mjs > out/country-stats.json
          cat out/country-stats.json

      - name: Publish to the stats branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b stats
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add country-stats.json
          git commit -q -m 'Update view stats'
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" stats
